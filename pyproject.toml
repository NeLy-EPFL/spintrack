[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "spintrack"
dynamic = ["version"]
description = "Track the 3D rotation of a spherical treadmill (trackball) from video and reconstruct fictive paths."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
authors = [{ name = "Thomas Ka Chung Lam", email = "thomas.lam@epfl.ch" }]
keywords = ["trackball", "spherical treadmill", "fictive path", "drosophila", "tracking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "av>=19.0",
    # fastapi and uvicorn serve the live view of `spintrack run` and the page of
    # `spintrack gui` (spintrack.web); uvicorn is imported only when a page is served.
    "fastapi>=0.143",
    "numpy>=2.5",
    "opencv-python-headless>=5.0",
    # pillow, torch, torchvision and transformers run SAM 3 (spintrack.segment).
    "pillow>=12.3",
    "polars>=2.0",
    "pydantic>=2.14",
    "torch>=2.14",
    "torchvision>=0.29",
    "transformers>=5.19",
    # The `spintrack` command line (spintrack.cli), imported only when it runs.
    "typer>=0.27",
    "uvicorn[standard]>=0.54",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]

[project.scripts]
spintrack = "spintrack.cli:main"

[project.urls]
Homepage = "https://github.com/NeLy-EPFL/spintrack"
Documentation = "https://nely-epfl.github.io/spintrack/"
Issues = "https://github.com/NeLy-EPFL/spintrack/issues"
Changelog = "https://github.com/NeLy-EPFL/spintrack/blob/main/CHANGELOG.md"

[tool.maturin]
python-source = "python"
module-name = "spintrack._core"
features = ["pyo3/extension-module"]
strip = true
# Keep benchmark media and results out of the source distribution.
exclude = [
    "benchmarks/data/**",
    "benchmarks/results/**",
    "dist/**",
    "docs/**",
    "notes/**",
    "plans/**",
    "target/**",
]

[tool.uv]
# Rebuild the extension when Rust sources change, not only on pyproject edits.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "rust/**/*.rs" },
]

[dependency-groups]
dev = [
    "httpx2>=2.13",  # FastAPI's TestClient, for the page's tests
    "pyrefly>=1.3",
    "pyserial>=3.5",  # the `serial` extra, for its tests and the type check
    "pytest>=9.1",
    "ruff>=0.16",
]
bench = [
    "tabulate>=0.10",
]
docs = [
    # MkDocs 2.0 (in pre-release) drops the plugin system mkdocstrings runs on.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7",
    "mkdocstrings[python]>=1.0",
    # Versioned docs: one built site per version on gh-pages, behind Material's
    # version selector. See .github/workflows/docs.yml.
    "mike>=2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# A warning the suite does not assert on is a bug in the code or in the test.
filterwarnings = ["error"]

[tool.ruff]
line-length = 88
src = ["python", "tests", "benchmarks"]

[tool.ruff.lint]
extend-select = ["E501", "I", "UP", "B", "D"]
# Docstring coverage is not enforced yet; the D2xx/D4xx formatting rules are.
ignore = ["D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["D100", "D103"]

[tool.pyrefly]
project-includes = ["python"]
python-version = "3.14"
# maturin's editable install puts python/ on the venv's import path, where pyrefly
# would take it for an installed package and leave it unchecked; name the venv's
# packages instead of asking the interpreter for its path (on Windows, the venv's
# is .venv/Lib/site-packages).
skip-interpreter-query = true
search-path = ["python"]
site-package-path = [".venv/lib/python3.14/site-packages"]
