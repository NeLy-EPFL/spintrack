[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "spintrack"
dynamic = ["version"]
description = "Track the 3D rotation of a spherical treadmill (trackball) from video and reconstruct fictive paths."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "Thomas Lam", email = "thomas.lam@epfl.ch" }]
keywords = ["trackball", "spherical treadmill", "fictive path", "drosophila", "tracking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "av>=13",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    # pillow, torch, torchvision and transformers run SAM 3 (spintrack.segment).
    "pillow>=11",
    "polars>=2",
    "pydantic>=2",
    "torch>=2.9",
    "torchvision>=0.24",
    "transformers>=5",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]

[project.scripts]
spintrack = "spintrack.cli:main"

[project.urls]
Repository = "https://github.com/NeLy-EPFL/spintrack"
Documentation = "https://github.com/NeLy-EPFL/spintrack/tree/main/docs"
Changelog = "https://github.com/NeLy-EPFL/spintrack/blob/main/CHANGELOG.md"

[tool.maturin]
python-source = "python"
module-name = "spintrack._core"
features = ["pyo3/extension-module"]
strip = true
# Keep benchmark media and results out of the source distribution.
exclude = [
    "benchmarks/data/**",
    "benchmarks/results/**",
    "dist/**",
    "notes/**",
    "plans/**",
    "target/**",
]

[tool.uv]
# Rebuild the extension when Rust sources change, not only on pyproject edits.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "rust/**/*.rs" },
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
bench = [
    "tabulate>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["python", "tests", "benchmarks"]

[tool.ruff.lint]
extend-select = ["E501", "I"]
