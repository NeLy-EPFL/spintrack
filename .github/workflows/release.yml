name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2014" }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2014" }
          - { os: macos-14, target: aarch64 }
          - { os: macos-14, target: x86_64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The abi3 floor is 3.14, so maturin needs a 3.14 interpreter outside manylinux.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  smoke:
    needs: [wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest-x86_64
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # The built wheel, outside the source tree, on the committed example clip.
      - run: pip install dist/*.whl
      - run: |
          cd "$RUNNER_TEMP"
          spintrack --version
          spintrack run "$GITHUB_WORKSPACE/examples/sample/config.toml" \
            --max-frames 20 --out smoke
          test -s smoke/tracks.parquet

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist, smoke]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
